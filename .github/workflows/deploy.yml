# Publishes the whole data plane to GitHub Pages: the committed JSON tiers
# (packs/) plus the per-pack .basis texture sets, which are NEVER committed
# here. Textures are sourced per pack, in order of preference:
#   1. the Actions cache (saved by any previous run);
#   2. bootstrap from the fbe repo's pinned pre-eviction commit (full packs
#      only — slim variants never existed there);
#   3. regeneration:
#      - full packs: the fbe exporter's dump pipeline (workflow_dispatch with
#        `regenerate`; needs FACTORIO_USERNAME / FACTORIO_TOKEN secrets);
#      - slim variants (graphics-only, `<base>-slim`): the fbe exporter's
#        --slim pipeline — census rect report over the BASE pack's committed
#        data.json, then crop + downscale of the source PNGs (needs the same
#        secrets, for the Factorio download only).
# Regeneration also rebuilds the JSON tiers and FAILS the run if they drift
# from the committed ones (regenerated JSON is uploaded as an artifact to
# commit), so the published site can never mix mismatched JSON and textures.
name: Deploy data plane

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      regenerate:
        description: "Regenerate pack(s) with the exporter (needs secrets)"
        type: choice
        default: none
        options:
          [
            none,
            all,
            vanilla-2.0,
            space-age,
            space-exploration,
            vanilla-2.0-slim,
            space-exploration-slim,
          ]

# One deploy at a time; a new push supersedes a queued one but never cancels
# a running deploy mid-publish.
concurrency:
  group: pages-deploy
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FBE_REPO: trisiak/factorio-blueprint-editor
  # The exporter/editor ref the regeneration paths build from.
  FBE_REF: master
  # The last fbe commit that still carries data/output textures. The bootstrap
  # path fetches THIS SHA (git history keeps the blobs even after fbe evicted
  # the files from its tree), so full packs stay rebuildable without secrets
  # even if the Actions cache evicts. Regeneration is the forward path.
  FBE_BOOTSTRAP_SHA: 2849afc9938aef802af656ecfcaf2fc1b27289e1

jobs:
  textures:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pack:
          [
            vanilla-2.0,
            space-age,
            space-exploration,
            vanilla-2.0-slim,
            space-exploration-slim,
          ]
    steps:
      - uses: actions/checkout@v4

      # Most-recent-wins cache: every run saves under a fresh run_id-suffixed
      # key; restore picks the newest by prefix. A regen therefore supersedes
      # older textures without cache-key gymnastics.
      - name: Restore textures from cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: textures/${{ matrix.pack }}
          key: textures-${{ matrix.pack }}-${{ github.run_id }}
          restore-keys: |
            textures-${{ matrix.pack }}-

      - name: Decide texture source
        id: source
        run: |
          REGEN="${{ github.event.inputs.regenerate || 'none' }}"
          case "${{ matrix.pack }}" in *-slim) SLIM=1 ;; *) SLIM=0 ;; esac
          if [ "$REGEN" = "all" ] || [ "$REGEN" = "${{ matrix.pack }}" ]; then
            if [ "$SLIM" = 1 ]; then echo "mode=slim" >> "$GITHUB_OUTPUT"; else echo "mode=regen" >> "$GITHUB_OUTPUT"; fi
          elif [ -d "textures/${{ matrix.pack }}" ] && [ -n "$(find textures/${{ matrix.pack }} -name '*.basis' -print -quit)" ]; then
            echo "mode=cache" >> "$GITHUB_OUTPUT"
          elif [ "$SLIM" = 1 ]; then
            # Slim variants have no bootstrap (they never existed in fbe's
            # history). With no cache and no rebuild requested, skip the pack —
            # the deploy job drops it from the served manifest until someone
            # dispatches regenerate=${{ matrix.pack }}.
            echo "::warning::no cached textures for ${{ matrix.pack }} — pack will be omitted; dispatch regenerate=${{ matrix.pack }} to build it"
            echo "mode=skip" >> "$GITHUB_OUTPUT"
          else
            echo "mode=bootstrap" >> "$GITHUB_OUTPUT"
          fi

      - name: Bootstrap textures from the fbe repo
        if: steps.source.outputs.mode == 'bootstrap'
        run: |
          git init -q fbe-data
          git -C fbe-data remote add origin "https://github.com/$FBE_REPO"
          git -C fbe-data sparse-checkout set --cone "packages/exporter/data/output/${{ matrix.pack }}"
          git -C fbe-data fetch -q --depth 1 --filter=blob:none origin "$FBE_BOOTSTRAP_SHA"
          git -C fbe-data checkout -q FETCH_HEAD
          SRC="fbe-data/packages/exporter/data/output/${{ matrix.pack }}"
          [ -d "$SRC" ] || { echo "::error::pack '${{ matrix.pack }}' not found at the bootstrap SHA"; exit 1; }
          mkdir -p "textures/${{ matrix.pack }}"
          # Texture set = the per-mod __<mod>__/ dirs (+ metadata.json, the
          # exporter's incremental cache — kept with the textures so a later
          # regen can skip unchanged sprites; excluded from the site).
          find "$SRC" -maxdepth 1 -type d -name '__*__' -exec cp -r {} "textures/${{ matrix.pack }}/" \;
          cp "$SRC/metadata.json" "textures/${{ matrix.pack }}/" 2>/dev/null || true
          rm -rf fbe-data
          echo "Bootstrapped $(find textures/${{ matrix.pack }} -name '*.basis' | wc -l) .basis files"

      - name: Regenerate with the fbe exporter
        if: steps.source.outputs.mode == 'regen'
        env:
          # BOTH values are secrets and auto-masked in logs — the username is
          # as sensitive as the token here. Never echo them, never `cat .env`,
          # never `set -x` in this step.
          FACTORIO_USERNAME: ${{ secrets.FACTORIO_USERNAME }}
          FACTORIO_TOKEN: ${{ secrets.FACTORIO_TOKEN }}
        run: |
          [ -n "$FACTORIO_USERNAME" ] && [ -n "$FACTORIO_TOKEN" ] || {
            echo "::error::FACTORIO_USERNAME / FACTORIO_TOKEN secrets are required for regeneration"; exit 1; }
          sudo apt-get update -q && sudo apt-get install -y -q xvfb
          git clone -q --depth 1 --branch "$FBE_REF" "https://github.com/$FBE_REPO" fbe
          cd fbe/packages/exporter
          printf 'FACTORIO_USERNAME=%s\nFACTORIO_TOKEN=%s\n' "$FACTORIO_USERNAME" "$FACTORIO_TOKEN" > .env
          # The manifest of record is THIS repo's.
          mkdir -p data/output
          cp "$GITHUB_WORKSPACE/packs/packs.json" data/output/packs.json
          # Seed the incremental atlas cache from the restored/bootstrapped
          # textures so unchanged sprites are skipped.
          if [ -d "$GITHUB_WORKSPACE/textures/${{ matrix.pack }}" ]; then
            mkdir -p "data/output/${{ matrix.pack }}"
            cp -r "$GITHUB_WORKSPACE/textures/${{ matrix.pack }}/." "data/output/${{ matrix.pack }}/"
          fi
          xvfb-run -a cargo run --release -- --pack "${{ matrix.pack }}" --exit
          # Collect outputs for the drift check + the deploy job.
          OUT="data/output/${{ matrix.pack }}"
          mkdir -p "$GITHUB_WORKSPACE/regen-json/${{ matrix.pack }}"
          cp "$OUT/data.json" "$GITHUB_WORKSPACE/regen-json/${{ matrix.pack }}/"
          cp -r "$OUT/browser" "$GITHUB_WORKSPACE/regen-json/${{ matrix.pack }}/"
          cp data/output/packs.json "$GITHUB_WORKSPACE/regen-json/"
          rm -rf "$GITHUB_WORKSPACE/textures/${{ matrix.pack }}"
          mkdir -p "$GITHUB_WORKSPACE/textures/${{ matrix.pack }}"
          find "$OUT" -maxdepth 1 -type d -name '__*__' -exec cp -r {} "$GITHUB_WORKSPACE/textures/${{ matrix.pack }}/" \;
          cp "$OUT/metadata.json" "$GITHUB_WORKSPACE/textures/${{ matrix.pack }}/" 2>/dev/null || true
          cd "$GITHUB_WORKSPACE"
          # JSON-aware compare: catalog.json embeds a `generated` timestamp
          # (always differs on regen — not drift), and the icon sheet's bytes
          # may vary across renderer/mesa versions without being wrong (the
          # COMMITTED sheet+rects pair is what gets served) — icons warn only.
          python3 - "packs/${{ matrix.pack }}" "regen-json/${{ matrix.pack }}" <<'PY' || echo "drift=true" >> "$GITHUB_ENV"
          import json, sys, filecmp
          committed, regen = sys.argv[1], sys.argv[2]
          def load(p, drop_generated=False):
              with open(p) as f:
                  data = json.load(f)
              if drop_generated and isinstance(data, dict):
                  data.pop("generated", None)
              return data
          ok = True
          if load(f"{committed}/data.json") != load(f"{regen}/data.json"):
              print("::error::data.json drifted"); ok = False
          if load(f"{committed}/browser/catalog.json", True) != load(f"{regen}/browser/catalog.json", True):
              print("::error::browser/catalog.json content drifted (generated timestamp ignored)"); ok = False
          if load(f"{committed}/browser/icons.json") != load(f"{regen}/browser/icons.json") \
             or not filecmp.cmp(f"{committed}/browser/icons.webp", f"{regen}/browser/icons.webp", shallow=False):
              print("::warning::icon sheet/rects differ from committed (renderer variance is expected; commit the regen-json artifact if intended)")
          sys.exit(0 if ok else 1)
          PY

      - name: Build slim variant with the fbe exporter
        if: steps.source.outputs.mode == 'slim'
        env:
          # Secrets are needed only for the Factorio download (source PNGs).
          # Same handling rules as above: both values masked, never echoed.
          FACTORIO_USERNAME: ${{ secrets.FACTORIO_USERNAME }}
          FACTORIO_TOKEN: ${{ secrets.FACTORIO_TOKEN }}
        run: |
          [ -n "$FACTORIO_USERNAME" ] && [ -n "$FACTORIO_TOKEN" ] || {
            echo "::error::FACTORIO_USERNAME / FACTORIO_TOKEN secrets are required (Factorio download)"; exit 1; }
          BASE="${{ matrix.pack }}"; BASE="${BASE%-slim}"
          git clone -q --depth 1 --branch "$FBE_REF" "https://github.com/$FBE_REPO" fbe
          cd fbe
          # Rect report: the census enumeration over the BASE pack's committed
          # data.json, using the same editor code that renders it.
          npm install --legacy-peer-deps --no-audit --no-fund
          mkdir -p "packages/exporter/data/output/$BASE"
          cp "$GITHUB_WORKSPACE/packs/packs.json" packages/exporter/data/output/packs.json
          cp "$GITHUB_WORKSPACE/packs/$BASE/data.json" "packages/exporter/data/output/$BASE/data.json"
          npm run rect-report -- "$BASE" /tmp/rect-report.json
          # Source PNGs: ensure the Factorio install, then build the variant.
          cd packages/exporter
          printf 'FACTORIO_USERNAME=%s\nFACTORIO_TOKEN=%s\n' "$FACTORIO_USERNAME" "$FACTORIO_TOKEN" > .env
          cargo run --release -- --pack "$BASE" --download-only
          # Seed the incremental cache from restored textures, if any.
          if [ -d "$GITHUB_WORKSPACE/textures/${{ matrix.pack }}" ]; then
            mkdir -p "data/output/${{ matrix.pack }}"
            cp -r "$GITHUB_WORKSPACE/textures/${{ matrix.pack }}/." "data/output/${{ matrix.pack }}/"
          fi
          cargo run --release -- --pack "$BASE" --slim /tmp/rect-report.json --exit
          OUT="data/output/${{ matrix.pack }}"
          # Drift check: data.json must be byte-identical to the committed base
          # copy; textures.json must match the committed sidecar (JSON compare).
          mkdir -p "$GITHUB_WORKSPACE/regen-json/${{ matrix.pack }}"
          cp "$OUT/data.json" "$OUT/textures.json" "$GITHUB_WORKSPACE/regen-json/${{ matrix.pack }}/"
          rm -rf "$GITHUB_WORKSPACE/textures/${{ matrix.pack }}"
          mkdir -p "$GITHUB_WORKSPACE/textures/${{ matrix.pack }}"
          find "$OUT" -maxdepth 1 -type d -name '__*__' -exec cp -r {} "$GITHUB_WORKSPACE/textures/${{ matrix.pack }}/" \;
          cp "$OUT/metadata.json" "$GITHUB_WORKSPACE/textures/${{ matrix.pack }}/" 2>/dev/null || true
          cd "$GITHUB_WORKSPACE"
          python3 - "packs/${{ matrix.pack }}" "regen-json/${{ matrix.pack }}" <<'PY' || echo "drift=true" >> "$GITHUB_ENV"
          import json, sys
          committed, regen = sys.argv[1], sys.argv[2]
          ok = True
          base = committed.rsplit("/", 1)[0] + "/" + committed.rsplit("/", 1)[1].removesuffix("-slim")
          if open(f"{base}/data.json", "rb").read() != open(f"{regen}/data.json", "rb").read():
              print("::error::slim data.json is not byte-identical to the base pack's committed one"); ok = False
          if json.load(open(f"{committed}/textures.json")) != json.load(open(f"{regen}/textures.json")):
              print("::error::textures.json drifted from the committed sidecar"); ok = False
          sys.exit(0 if ok else 1)
          PY

      - name: Upload regenerated JSON (drift)
        if: steps.source.outputs.mode == 'regen' || steps.source.outputs.mode == 'slim'
        uses: actions/upload-artifact@v4
        with:
          name: regen-json-${{ matrix.pack }}
          path: regen-json
          retention-days: 7
          if-no-files-found: ignore

      - name: Fail on JSON drift
        if: env.drift == 'true'
        run: |
          echo "::error::Regenerated JSON tiers differ from the committed packs/${{ matrix.pack }} — download the regen-json-${{ matrix.pack }} artifact, commit it, and re-run."
          exit 1

      - name: Save textures to cache
        if: steps.source.outputs.mode != 'cache' && steps.source.outputs.mode != 'skip'
        uses: actions/cache/save@v4
        with:
          path: textures/${{ matrix.pack }}
          key: textures-${{ matrix.pack }}-${{ github.run_id }}

      - name: Upload textures for the deploy job
        if: steps.source.outputs.mode != 'skip'
        uses: actions/upload-artifact@v4
        with:
          name: textures-${{ matrix.pack }}
          path: textures/${{ matrix.pack }}
          retention-days: 1
          compression-level: 0 # .basis is already compressed

  deploy:
    needs: textures
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Download textures
        uses: actions/download-artifact@v4
        with:
          pattern: textures-*
          path: textures

      - name: Assemble site
        run: |
          mkdir -p _site
          # Driven by the manifest: every pack ships its committed JSON tiers
          # (data.json, optional textures.json sidecar, optional browser/)
          # plus the texture set from its build artifact. A pack whose texture
          # artifact is absent (a skipped, never-built slim variant) is dropped
          # from the SERVED manifest so consumers never see a broken entry.
          SERVED=""
          for p in $(python3 -c "import json; print(' '.join(e['id'] for e in json.load(open('packs/packs.json'))))"); do
            if [ ! -d "textures/textures-$p" ]; then
              echo "::warning::omitting pack '$p' — no texture artifact in this run"
              continue
            fi
            SERVED="$SERVED $p"
            mkdir -p "_site/$p"
            # Graphics-only variants don't commit a duplicate data.json — it is
            # byte-identical to the base pack's (variantOf), which serves it.
            if [ -f "packs/$p/data.json" ]; then
              cp "packs/$p/data.json" "_site/$p/"
            else
              BASEPACK=$(python3 -c "import json,sys; print(next(e.get('variantOf','') for e in json.load(open('packs/packs.json')) if e['id']=='$p'))")
              cp "packs/$BASEPACK/data.json" "_site/$p/"
            fi
            [ -f "packs/$p/textures.json" ] && cp "packs/$p/textures.json" "_site/$p/"
            [ -d "packs/$p/browser" ] && cp -r "packs/$p/browser" "_site/$p/"
            cp -r "textures/textures-$p/." "_site/$p/"
            rm -f "_site/$p/metadata.json" # exporter's incremental cache, not served
          done
          python3 - $SERVED <<'PY'
          import json, sys
          served = set(sys.argv[1:])
          packs = [p for p in json.load(open('packs/packs.json')) if p['id'] in served]
          with open('_site/packs.json', 'w') as f:
              json.dump(packs, f, indent=4)
              f.write('\n')
          PY
          echo "Site: $(du -sh _site | cut -f1), $(find _site -type f | wc -l) files"

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
